# Polynomial input preconditioning: Chebyshev d=4, stride=16, 10% dropout
# This is the recommended configuration (HD10 in the paper).
model:
  module_kwargs:
    time_precondition_enabled: true
    time_precondition_type: chebyshev
    time_precondition_degree: 4
    time_precondition_stride: 16
    time_precondition_hint_mode: true
    hint_dropout: 0.1
