# Capacity control: duplicate hint channel (copies the target as the hint)
model:
  module_kwargs:
    time_precondition_enabled: true
    time_precondition_type: chebyshev
    time_precondition_degree: 4
    time_precondition_stride: 16
    time_precondition_hint_mode: true
    hint_dropout: 0.0
    hint_ablation: duplicate
