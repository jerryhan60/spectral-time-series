# Learned FIR filter initialized to Chebyshev coefficients, d=4, stride=16, 10% dropout
model:
  module_kwargs:
    time_precondition_enabled: true
    time_precondition_type: chebyshev
    time_precondition_degree: 4
    time_precondition_stride: 16
    time_precondition_hint_mode: true
    time_precondition_learned: true
    time_precondition_init: chebyshev
    hint_dropout: 0.1
